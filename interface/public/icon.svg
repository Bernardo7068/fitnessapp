<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de Fundo Principal Dark Emerald -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="45%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Gradiente Esmeralda para o Halter -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="35%" stop-color="#34d399" />
      <stop offset="75%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Gradiente para o texto nov -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Fundo do Ícone em Volta de Tudo (Squircle Dark Emerald com Borda Fina) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="502" height="502" x="5" y="5" rx="112" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.25" />

  <!-- Símbolo Halter Dinâmico 100% Vetorial Limpo (Sem filtros nem caixas em volta) -->
  <g transform="translate(256,182) scale(9.2) translate(-12,-12)" stroke="url(#accentGrad)" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Barra Central -->
    <path d="m6.5 6.5 11 11" stroke-width="2.8" />
    <!-- Pontas -->
    <path d="m21 21-1-1" stroke-width="2.5" />
    <path d="m3 3 1 1" stroke-width="2.5" />
    <!-- Discos Exteriores -->
    <path d="m18 22 4-4" stroke-width="3" />
    <path d="m2 6 4-4" stroke-width="3" />
    <!-- Discos Interiores -->
    <path d="m3 10 7-7" stroke-width="2.6" />
    <path d="m14 21 7-7" stroke-width="2.6" />
  </g>

  <!-- Marca Tipográfica: BInov Unido (BI em branco, nov no gradiente esmeralda, sem ponto) -->
  <g id="brand-text">
    <text x="256" y="380" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="78" letter-spacing="0.5"><tspan fill="#ffffff">BI</tspan><tspan fill="url(#textGrad)">nov</tspan></text>

    <!-- Sub-marca FITNESS -->
    <text x="256" y="420" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" letter-spacing="8" fill="#94a3b8" opacity="0.9">FITNESS</text>
  </g>
</svg>
