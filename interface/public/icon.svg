<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de Fundo Premium Dark -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="45%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Gradiente Esmeralda Neon -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="40%" stop-color="#34d399" />
      <stop offset="80%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Gradiente Texto nov -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Brilho Neon (Glow) -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo do Ícone (Squircle para Android e iOS) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="502" height="502" x="5" y="5" rx="112" fill="none" stroke="#10b981" stroke-width="5" stroke-opacity="0.3" />

  <!-- Brilho Ambiente Central -->
  <circle cx="256" cy="190" r="130" fill="#10b981" opacity="0.16" filter="url(#glow)" />
  <circle cx="256" cy="380" r="90" fill="#10b981" opacity="0.08" filter="url(#glow)" />

  <!-- Símbolo Halter Dinâmico em Alta Definição -->
  <g transform="translate(256,182) scale(8.8) translate(-12,-12)" stroke="url(#accentGrad)" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)">
    <!-- Barra Central -->
    <path d="m6.5 6.5 11 11" stroke-width="2.8" />
    <!-- Pontas -->
    <path d="m21 21-1-1" stroke-width="2.5" />
    <path d="m3 3 1 1" stroke-width="2.5" />
    <!-- Discos Exteriores -->
    <path d="m18 22 4-4" stroke-width="3" />
    <path d="m2 6 4-4" stroke-width="3" />
    <!-- Discos Interiores -->
    <path d="m3 10 7-7" stroke-width="2.6" />
    <path d="m14 21 7-7" stroke-width="2.6" />
  </g>

  <!-- Marca Tipográfica BInov -->
  <!-- Estilo Moderno, Geométrico e de Alto Contraste -->
  <g id="brand-text">
    <text x="256" y="380" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="74" letter-spacing="1">
      <tspan fill="#ffffff">BI</tspan>
      <tspan fill="url(#textGrad)">nov</tspan>
    </text>

    <!-- Sub-marca FITNESS com espaçamento elegante -->
    <text x="256" y="420" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" letter-spacing="8" fill="#94a3b8" opacity="0.9">
      FITNESS
    </text>

    <!-- Ponto de Acento Dinâmico -->
    <circle cx="384" cy="354" r="5.5" fill="#34d399" filter="url(#subtleGlow)" />
  </g>
</svg>
